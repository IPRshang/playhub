<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;user-select:none;gap:10px;padding:10px}
.game-wrapper{display:flex;gap:16px;align-items:flex-start}
.bcont{background:#1a1a2e;border:2px solid #333;border-radius:12px;padding:12px;box-shadow:0 0 40px rgba(0,0,0,0.5)}
.board{display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:8px}
.tile{width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;transition:all 0.15s ease}
.tile-0{background:#1f2937}.tile-2{background:#2d3a4a;color:#ccc}.tile-4{background:#2c4a3a;color:#ccc}.tile-8{background:#c0392b;color:white}.tile-16{background:#d35400;color:white}.tile-32{background:#e67e22;color:white}.tile-64{background:#e74c3c;color:white}.tile-128{background:#f1c40f;color:white;font-size:24px}.tile-256{background:#f39c12;color:white;font-size:24px}.tile-512{background:#e67e22;color:white;font-size:24px}.tile-1024{background:#e94560;color:white;font-size:20px}.tile-2048{background:#9b59b6;color:white;font-size:20px;animation:wp 0.5s ease infinite alternate}
@keyframes wp{from{box-shadow:0 0 10px #9b59b6}to{box-shadow:0 0 30px #9b59b6,0 0 60px #8e44ad}}
.panel{background:#16213e;border:2px solid #0f3460;border-radius:8px;padding:16px;color:#eee;width:170px;box-shadow:0 0 20px rgba(0,0,0,0.3)}
.panel h2{font-size:16px;color:#4ecdc4;text-align:center;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
.sr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;font-size:13px}
.sl{color:#aaa}.sv{font-weight:bold}.sv.score{color:#f39c12}.sv.best{color:#e94560}
.btn{display:block;width:100%;padding:10px;margin-top:10px;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-r{background:#e94560;color:white}.btn-r:hover{background:#c0392b}
.hint{font-size:11px;color:#555;text-align:center;margin-top:8px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:200;display:none}
.overlay.show{display:flex}
.obox{background:#16213e;border:2px solid #e94560;border-radius:16px;padding:32px;text-align:center;color:white}
.obox h1{font-size:28px;margin-bottom:12px}.obox p{font-size:16px;margin-bottom:20px;color:#ccc}
@media(max-width:600px){.game-wrapper{flex-direction:column;align-items:center}.panel{width:100%;max-width:360px}.board{grid-template-columns:repeat(4,65px);grid-template-rows:repeat(4,65px);gap:5px}.tile{width:65px;height:65px;font-size:22px}}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="bcont"><div class="board" id="board"></div></div>
<div class="panel"><h2>🔢 2048</h2>
<div class="sr"><span class="sl">🏆 分数</span><span class="sv score" id="score">0</span></div>
<div class="sr"><span class="sl">👑 最高分</span><span class="sv best" id="best">0</span></div>
<button class="btn btn-r" onclick="restart()">🔄 重新开始</button>
<div class="hint">方向键滑动 | 支持触屏</div></div></div>
<div class="overlay" id="ov"><div class="obox"><h1 id="otitle">💀 游戏结束</h1><p>最终得分: <b id="fs">0</b></p><button class="btn btn-r" onclick="restart()">🔄 再来一局</button></div></div>
<script>
const be=document.getElementById('board');let g=[],sc=0,bs=0,gov=!1,won=!1;
bs=localStorage.getItem('f2048best')||0;document.getElementById('best').textContent=bs;
function init(){g=Array.from({length:4},()=>Array(4).fill(0));sc=0;gov=!1;won=!1;document.getElementById('ov').classList.remove('show');addR();addR();render();upUI()}
function addR(){let e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(g[r][c]===0)e.push({r,c});if(!e.length)return;let{x:r,y:c}=e[Math.floor(Math.random()*e.length)];g[r][c]=Math.random()<0.9?2:4}
function render(){be.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){let t=document.createElement('div');t.className='tile tile-'+g[r][c];t.textContent=g[r][c]||'';be.appendChild(t)}}
function slide(rw){let a=rw.filter(v=>v!==0);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;sc+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);return a}
function move(dir){if(gov)return!1;let o=JSON.stringify(g),ng=Array.from({length:4},()=>Array(4).fill(0));
if(dir==='left'){for(let r=0;r<4;r++)ng[r]=slide(g[r])}
else if(dir==='right'){for(let r=0;r<4;r++)ng[r]=slide([...g[r]].reverse()).reverse()}
else if(dir==='up'){for(let c=0;c<4;c++){let cl=slide([g[0][c],g[1][c],g[2][c],g[3][c]]);for(let r=0;r<4;r++)ng[r][c]=cl[r]}}
else if(dir==='down'){for(let c=0;c<4;c++){let cl=slide([g[3][c],g[2][c],g[1][c],g[0][c]]).reverse();for(let r=0;r<4;r++)ng[r][c]=cl[r]}}
if(JSON.stringify(ng)!==o){g=ng;addR();render();upUI();
if(!won&&g.some(r=>r.some(v=>v>=2048))){won=!0;document.getElementById('otitle').textContent='🎉 恭喜！';document.getElementById('fs').textContent=sc;document.getElementById('ov').classList.add('show')}
if(isOver()){gov=!0;if(!won)document.getElementById('otitle').textContent='💀 游戏结束';document.getElementById('fs').textContent=sc;document.getElementById('ov').classList.add('show');if(sc>bs){bs=sc;localStorage.setItem('f2048best',bs)}upUI()}return!0}return!1}
function isOver(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(g[r][c]===0)return!1;if(c<3&&g[r][c]===g[r][c+1])return!1;if(r<3&&g[r][c]===g[r+1][c])return!1}return!0}
function upUI(){document.getElementById('score').textContent=sc;if(sc>bs){bs=sc;localStorage.setItem('f2048best',bs)}document.getElementById('best').textContent=bs}
function restart(){init()}
document.addEventListener('keydown',e=>{switch(e.key){case'ArrowLeft':e.preventDefault();move('left');break;case'ArrowRight':e.preventDefault();move('right');break;case'ArrowUp':e.preventDefault();move('up');break;case'ArrowDown':e.preventDefault();move('down');break}});
let sx,sy;be.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});be.addEventListener('touchend',e=>{if(!sx)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));sx=null});
init();
</script>
</body>
</html>
