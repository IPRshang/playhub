<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔢 2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none;gap:10px;padding:10px;touch-action:manipulation;overflow:hidden;
}
.game-wrapper{display:flex;gap:16px;align-items:flex-start}
.bcont{
  background:#1a1a2e;border:2px solid #333;border-radius:12px;padding:12px;
  box-shadow:0 0 40px rgba(0,0,0,0.5);position:relative;
}
.board{display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:8px;position:relative}
.tile{
  width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:bold;position:relative;z-index:2;
}
.tile-0{background:#1f2937}
.tile-2{background:#2d3a4a;color:#ccc}
.tile-4{background:#2c4a3a;color:#ccc}
.tile-8{background:#c0392b;color:white}
.tile-16{background:#d35400;color:white}
.tile-32{background:#e67e22;color:white}
.tile-64{background:#e74c3c;color:white}
.tile-128{background:#f1c40f;color:white;font-size:24px}
.tile-256{background:#f39c12;color:white;font-size:24px}
.tile-512{background:#e67e22;color:white;font-size:24px}
.tile-1024{background:#e94560;color:white;font-size:20px}
.tile-2048{background:#9b59b6;color:white;font-size:20px}
.tile-4096{background:#8e44ad;color:white;font-size:18px}
.tile-8192{background:#2ecc71;color:white;font-size:18px}

/* 动画 */
.tile-new{animation:popIn 0.2s ease}
.tile-merged{animation:popIn 0.25s ease;z-index:3}
@keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

.panel{background:#16213e;border:2px solid #0f3460;border-radius:8px;padding:16px;color:#eee;width:170px;box-shadow:0 0 20px rgba(0,0,0,0.3)}
.panel h2{font-size:16px;color:#4ecdc4;text-align:center;margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px}
.sr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;font-size:13px}
.sl{color:#aaa}.sv{font-weight:bold}.sv.score{color:#f39c12}.sv.best{color:#e94560}
.btn{display:block;width:100%;padding:10px;margin-top:6px;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;transition:all 0.15s}
.btn-r{background:#e94560;color:white}.btn-r:hover{background:#c0392b}.btn-r:active{transform:scale(0.95)}
.btn-u{background:#4ecdc4;color:#1a1a2e}.btn-u:hover{background:#3dbdb5}.btn-u:active{transform:scale(0.95)}
.btn-u:disabled{opacity:0.3;cursor:not-allowed}
.hint{font-size:11px;color:#555;text-align:center;margin-top:6px}

/* 游戏结束/胜利弹窗 */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:200;display:none}
.overlay.show{display:flex}
.obox{background:#16213e;border:2px solid #e94560;border-radius:16px;padding:32px;text-align:center;color:white}
.obox h1{font-size:28px;margin-bottom:12px}.obox p{font-size:16px;margin-bottom:16px;color:#ccc}
.obox .btns{display:flex;gap:10px;justify-content:center}
.obox .btns .btn{width:auto;padding:10px 20px}
.obox .btn-g{background:#2ecc71;color:white}.obox .btn-g:hover{background:#27ae60}

/* 最高分闪烁 */
@keyframes glow{0%,100%{color:#e94560}50%{color:#f39c12}}
.best-new{animation:glow 0.6s ease 3}

/* 响应式 */
@media(max-width:650px){
  body{gap:6px;padding:4px}
  .game-wrapper{flex-direction:column;align-items:center;gap:8px}
  .panel{width:100%;max-width:400px;padding:10px 14px}
  .board{grid-template-columns:repeat(4,65px);grid-template-rows:repeat(4,65px);gap:5px}
  .tile{width:65px;height:65px;font-size:22px}
  .tile-128,.tile-256,.tile-512{font-size:19px}
  .tile-1024,.tile-2048{font-size:16px}
  .tile-4096,.tile-8192{font-size:15px}
}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="bcont"><div class="board" id="board"></div></div>
<div class="panel"><h2>🔢 2048</h2>
<div class="sr"><span class="sl">🏆 分数</span><span class="sv score" id="score">0</span></div>
<div class="sr"><span class="sl">👑 最高分</span><span class="sv best" id="best">0</span></div>
<button class="btn btn-u" id="undoBtn" onclick="undo()" disabled>↩ 撤销一步</button>
<button class="btn btn-r" onclick="restart()">🔄 重新开始</button>
<div class="hint">方向键 / 滑动操控</div></div></div>

<div class="overlay" id="ov"><div class="obox"><h1 id="otitle">💀 游戏结束</h1><p>最终得分: <b id="fs">0</b></p>
<div class="btns"><button class="btn btn-g" onclick="keepPlaying()" id="keepBtn" style="display:none">🎮 继续挑战</button><button class="btn btn-r" onclick="restart()">🔄 再来一局</button></div></div></div>

<script>
const boardEl=document.getElementById('board');
let grid=[], score=0, bestScore=0, gameOver=false, won=false, keepPlayingFlag=false;
let history=[]; // 撤销历史 [{grid, score}]

bestScore=parseInt(localStorage.getItem('f2048best_v2'))||0;
document.getElementById('best').textContent=bestScore;

function cloneGrid(g){return g.map(r=>[...r])}

function saveState(){
  history.push({grid:cloneGrid(grid),score:score});
  if(history.length>10)history.shift();
  document.getElementById('undoBtn').disabled=false;
}

function init(){
  grid=Array.from({length:4},()=>Array(4).fill(0));
  score=0;gameOver=false;won=false;keepPlayingFlag=false;history=[];
  document.getElementById('undoBtn').disabled=true;
  document.getElementById('ov').classList.remove('show');
  document.getElementById('keepBtn').style.display='none';
  addRandom();addRandom();render();updateUI();
}

function addRandom(){
  let empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(grid[r][c]===0)empty.push({r,c});
  if(!empty.length)return;
  let {r,c}=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}

function render(){
  boardEl.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    let v=grid[r][c];
    let t=document.createElement('div');
    t.className='tile tile-'+Math.min(v,8192);
    t.textContent=v||'';
    boardEl.appendChild(t);
  }
}

function slide(row){
  let arr=row.filter(v=>v!==0);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i]*=2;score+=arr[i];
      arr.splice(i+1,1);
    }
  }
  while(arr.length<4)arr.push(0);
  return arr;
}

function move(dir){
  if(gameOver&&!keepPlayingFlag)return false;
  saveState();

  let old=JSON.stringify(grid),newGrid=Array.from({length:4},()=>Array(4).fill(0));

  if(dir==='left'){for(let r=0;r<4;r++)newGrid[r]=slide(grid[r])}
  else if(dir==='right'){for(let r=0;r<4;r++)newGrid[r]=slide([...grid[r]].reverse()).reverse()}
  else if(dir==='up'){for(let c=0;c<4;c++){let col=slide([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]);for(let r=0;r<4;r++)newGrid[r][c]=col[r]}}
  else if(dir==='down'){for(let c=0;c<4;c++){let col=slide([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]).reverse();for(let r=0;r<4;r++)newGrid[r][c]=col[r]}}

  if(JSON.stringify(newGrid)!==old){
    grid=newGrid;addRandom();render();updateUI();

    // 胜利检测：到达2048且之前未赢过
    if(!won&&!keepPlayingFlag&&grid.some(r=>r.some(v=>v>=2048))){
      won=true;
      document.getElementById('otitle').textContent='🎉 恭喜！';
      document.getElementById('fs').textContent=score;
      document.getElementById('keepBtn').style.display='inline-block';
      document.getElementById('ov').classList.add('show');
    }

    // 游戏结束检测
    if(isOver()){
      gameOver=true;
      if(!won||keepPlayingFlag){
        document.getElementById('otitle').textContent='💀 游戏结束';
        document.getElementById('keepBtn').style.display='none';
      }
      document.getElementById('fs').textContent=score;
      document.getElementById('ov').classList.add('show');
      if(score>bestScore){bestScore=score;localStorage.setItem('f2048best_v2',bestScore)}
      updateUI();
    }
    return true;
  }
  // 没有移动，丢弃保存的状态
  history.pop();
  return false;
}

function isOver(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(grid[r][c]===0)return false;
    if(c<3&&grid[r][c]===grid[r][c+1])return false;
    if(r<3&&grid[r][c]===grid[r+1][c])return false;
  }
  return true;
}

function undo(){
  if(!history.length)return;
  let prev=history.pop();
  grid=prev.grid;score=prev.score;
  if(!history.length)document.getElementById('undoBtn').disabled=true;
  render();updateUI();
}

function keepPlaying(){
  keepPlayingFlag=true;
  document.getElementById('ov').classList.remove('show');
  // 如果已经死局了，重新渲染即可（状态已经标记）
  if(!isOver())gameOver=false;
}

function updateUI(){
  document.getElementById('score').textContent=score;
  let bestEl=document.getElementById('best');
  if(score>bestScore){bestScore=score;localStorage.setItem('f2048best_v2',bestScore);bestEl.classList.add('best-new');setTimeout(()=>bestEl.classList.remove('best-new'),2000)}
  bestEl.textContent=bestScore;
}

function restart(){init()}

// === 键盘控制 ===
document.addEventListener('keydown',e=>{
  if((gameOver&&!keepPlayingFlag)&&e.key===' ')return; // 游戏结束按空格没用
  switch(e.key){
    case'ArrowLeft':e.preventDefault();move('left');break;
    case'ArrowRight':e.preventDefault();move('right');break;
    case'ArrowUp':e.preventDefault();move('up');break;
    case'ArrowDown':e.preventDefault();move('down');break;
    case'z':case'Z':if(e.ctrlKey||e.metaKey){e.preventDefault();undo();}break;
  }
});

// === 移动端滑动（整个页面都可滑动） ===
let sx=0,sy=0,sTime=0;
document.addEventListener('touchstart',e=>{
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;sTime=Date.now();
},{passive:true});

document.addEventListener('touchend',e=>{
  if(!sx)return;
  let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  let dist=Math.sqrt(dx*dx+dy*dy);
  // 需要滑动超过30px 或 快速滑动(>15px且<300ms)
  if(dist<15||(dist<30&&Date.now()-sTime>300)){sx=0;return}
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  sx=0;
});

// === 鼠标拖拽（桌面端也支持） ===
let mx=0,my=0;
boardEl.addEventListener('mousedown',e=>{mx=e.clientX;my=e.clientY});
boardEl.addEventListener('mouseup',e=>{
  let dx=e.clientX-mx,dy=e.clientY-my;
  if(Math.abs(dx)<15&&Math.abs(dy)<15)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});

// 阻止弹窗内的滑动冒泡
document.getElementById('ov').addEventListener('touchstart',e=>e.stopPropagation());

init();
</script>
</body>
</html>
